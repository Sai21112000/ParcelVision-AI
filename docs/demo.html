<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ParcelVision AI · Scan receipt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<link rel="stylesheet" href="parcelvision.css">
</head>
<body class="scan-page">
<div class="scan" id="screen-live">
  <video class="scan-video" id="sm-cam" playsinline webkit-playsinline muted autoplay></video>
  <div class="scan-guide" id="scan-guide">
    <div class="scan-coach" id="scan-coach">Hold the receipt in view</div>
  </div>
  <div class="scan-ring-wrap" id="scan-ring" hidden>
    <svg class="scan-ring" viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="45"></circle>
      <circle class="progress" cx="50" cy="50" r="45"></circle>
    </svg>
  </div>
  <div class="scan-hud">
    <button class="scan-torch" id="scan-torch" type="button" hidden>Turn on flashlight</button>
  </div>
  <div class="scan-spinner" id="scan-spinner">
    <i></i>
    <div>Preparing scanner…</div>
  </div>
</div>

<div class="scan-result" id="screen-result" hidden>
  <h1>Receipt ready</h1>
  <img id="scan-preview" alt="Cleaned receipt">
  <div class="status" id="scan-status"></div>
  <div class="scan-actions">
    <button class="btn btn-primary" id="scan-confirm" type="button">Confirm &amp; Upload Receipt</button>
    <button class="btn btn-ghost" id="scan-retake" type="button">Retake</button>
  </div>
</div>

<div class="scan-done" id="screen-done" hidden>
  <div class="mark">✓</div>
  <h1>Receipt uploaded</h1>
  <p id="done-note">The cleaned scan is ready for the next step.</p>
  <button class="btn btn-primary" id="scan-again" type="button">Scan another</button>
</div>

<script type="module" src="scan-app.mjs"></script>
</body>
</html>
